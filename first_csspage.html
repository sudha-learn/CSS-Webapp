<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Login - Sudha Webpage</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }

      header {
        background-color: #0932d4;
        padding: 15px;
        text-align: center;
      }

      header h1 {
        color: white;
        margin: 0;
      }

      main {
        padding: 20px;
      }

      .card {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        max-width: 400px;
        margin: 0 auto;
      }

      .card h2 {
        margin-top: 0;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      .btn {
        display: inline-block;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #0056b3;
      }

      .link {
        display: block;
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
      }

      .link a {
        text-decoration: none;
        color: #007bff;
      }

      .link a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        font-size: 12px;
        padding: 10px;
        margin-top: 20px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sudha Webpage - Login</h1>
    </header>

    <main>
      <div class="card">
        <h2>Login</h2>
        <form>
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" placeholder="Enter your username">

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password">

          <button type="submit" class="btn">Login</button>

          <div class="link">
            <a href="index.html">Back to Home</a>
          </div>
        </form>
      </div>
    </main>

    <footer>
      &copy; 2025 My Website
    </footer>
  </body>
</html>

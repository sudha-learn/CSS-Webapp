<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Login - Employee Career</title>
    <style>
      /* Global Reset */
      * {
        box-sizing: border-box;
      }

      /* Body Styling (Background and Centering) */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-image: url('employee.jpg'); 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Header Title Styling (Fixed Top Banner) */
      .title {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%; 
        color: #FFFFFF; 
        background-color: rgba(22, 59, 126, 0.85); 
        padding: 15px 0; 
        text-align: center;
        font-size: 32px; 
        font-weight: bold;
        text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      }

      /* Login Box Styling */
      .card {
        background-color: rgba(255, 255, 255, 0.96); 
        padding: 30px 40px; 
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
        width: 380px; 
        border: 2px solid #163B7E; 
        margin-top: 60px;
      }
      
      .card h2 {
          color: #163B7E; 
          margin-top: 0;
          margin-bottom: 20px;
          text-align: center;
      }

      .card label {
          display: block;
          margin-bottom: 5px;
          font-weight: bold;
          color: #333;
      }

      .card input[type="text"],
      .card input[type="password"] {
          width: 100%;
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #ccc;
          border-radius: 4px;
      }
      
      /* Container for the two buttons to sit next to each other */
      .button-container {
          display: flex;
          justify-content: space-between; /* Pushes buttons to the edges */
          gap: 10px; /* Space between the buttons */
          margin-top: 15px;
      }

      .button-container button {
          /* Apply common button styles */
          flex: 1; /* Makes both buttons take up equal width */
          padding: 12px;
          color: white;
          border: none;
          border-radius: 4px;
          font-size: 16px;
          cursor: pointer;
          transition: background-color 0.3s;
      }

      /* Specific style for the Login button */
      .login-btn {
          background-color: #163B7E; /* Dark Blue for Login */
      }

      .login-btn:hover {
          background-color: #123063;
      }
      
      /* Specific style for the Register button */
      .register-btn {
          background-color: #5AA92C; /* Green for Register */
      }
      
      .register-btn:hover {
          background-color: #4c8a25;
      }
      
    </style>
  </head>
  <body>
    <div class="title">
        Employee Career Portal
    </div>

    <div class="card">
        <h2>Login</h2>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <div class="button-container">
                <button type="submit" class="login-btn">Login</button>
                
                <button type="button" class="register-btn">Register</button>
            </div>
            </form>
    </div>

  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Login - Employee Career</title>
    <style>
      /* CSS Styles (Same as before) */
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-image: url('employee.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
      .title { position: fixed; top: 0; left: 0; width: 100%; color: #FFFFFF; background-color: rgba(22, 59, 126, 0.85); padding: 15px 0; text-align: center; font-size: 32px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
      .card { background-color: rgba(255, 255, 255, 0.96); padding: 30px 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); width: 380px; border: 2px solid #163B7E; margin-top: 60px; }
      .card h2 { color: #163B7E; margin-top: 0; margin-bottom: 20px; text-align: center; }
      .card label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
      .card input[type="text"], .card input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
      .button-container { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
      .button-container button { flex: 1; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background-color 0.3s; }
      .login-btn { background-color: #163B7E; }
      .login-btn:hover { background-color: #123063; }
      .register-btn { background-color: #5AA92C; }
      .register-btn:hover { background-color: #4c8a25; }
      .error-message { color: red; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="title">Employee Career Portal</div>
    <div class="card">
      <h2>Login</h2>

      <div id="errorMessage" class="error-message" style="display: none;"></div>
      
      <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
      </form>
      
      <div class="button-container">
        <button type="button" class="login-btn" onclick="validateLogin()">Login</button>
        <button type="button" class="register-btn" onclick="goToRegistration()">Register</button>
      </div>
    </div>

    <script>
      function validateLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        let errorMsg = '';

        if (username === '') {
          errorMsg = 'Username is required.';
        } else if (!username.includes('@gmail.com')) {
          errorMsg = 'Username must be a @gmail.com email address.';
        }
        
        if (password === '') {
          if (errorMsg === '') {
             errorMsg = 'Password is required.';
          }
        } else if (password.length < 8) {
          errorMsg = 'Password must be at least 8 characters long.';
        }

        if (errorMsg !== '') {
          errorDiv.textContent = errorMsg;
          errorDiv.style.display = 'block';
          return false;
        } else {
          errorDiv.style.display = 'none';
          window.location.href = 'details.html'; // Successful login redirect
          return true;
        }
      }

      function goToRegistration() {
        // Correctly redirects to the registration page
        window.location.href = 'register.html';
      }
    </script>
  </body>
</html>

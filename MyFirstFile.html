<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My First Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 16px 24px;
    }
    main {
      max-width: 800px;
      margin: 24px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1, h2 {
      margin-top: 0;
    }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      margin-top: 8px;
    }
    footer {
      text-align: center;
      padding: 16px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My First Webpage</h1>
  </header>

  <main>
    <h2>Hello 👋</h2>
    <p>
      This is my first webpage. I created this without knowing coding,
      just by copying and pasting!
    </p>

    <p>
      I can change this text later to anything I want.
    </p>

    <a href="#" class="button">This is a button</a>
  </main>

  <footer>
    &copy; 2025 My First Webpage
  </footer>
</body>
</html>

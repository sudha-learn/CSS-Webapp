name: Restart Service on Merge

on:
  push:
    branches:
      - master   # run when code is pushed/merged to master

jobs:
  restart-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Restart service on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            echo "Connected to server. Restarting service..."
            sudo systemctl restart my-service-name
            sudo systemctl status my-service-name --no-pager -l || true
          EOF
